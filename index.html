  <script>
    window.__LANCERS_BOOT_STARTED__=Date.now();

      var loading=document.querySelector('.loading');
      if(!loading) return;
      try{localStorage.removeItem('lancers-chapel-session');}catch(e){}
      loading.innerHTML='<div style="text-align:center;padding:24px"><strong style="display:block;margin-bottom:12px">Fresh sign-in needed</strong><button id="force-signin" style="border:0;border-radius:10px;background:#f47a22;color:#080808;font-weight:900;padding:12px 18px">Go to Sign In</button></div>';
      var b=document.getElementById('force-signin');
      if(b)b.onclick=function(){try{localStorage.removeItem('lancers-chapel-session');sessionStorage.clear();}catch(e){} location.replace('/?fresh='+Date.now());};
    },7000);
